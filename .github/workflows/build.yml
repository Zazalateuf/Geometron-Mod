name: Build Geometron (Geode 6.0.0)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Win64
            runner: windows-latest
          - target: MacOS
            runner: macos-latest
          - target: iOS
            runner: macos-latest
          - target: Android32
            runner: ubuntu-latest
          - target: Android64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out Geometron
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      # Source ZIPs do not preserve Git submodule links.
      - name: Restore Lua when building from an imported ZIP
        if: ${{ hashFiles('external/lua/CMakeLists.txt') == '' }}
        uses: actions/checkout@v7
        with:
          repository: kxtbit/geometron-lua-cmake
          ref: 371e11cc882209772a022fc5588095af52ea230b
          path: external/lua
          submodules: recursive
          persist-credentials: false

      - name: Check Lua source tree
        shell: bash
        run: |
          if [[ ! -f external/lua/CMakeLists.txt || ! -f external/lua/upstream/lstate.h ]]; then
            echo '::error::Lua or its nested submodule is missing from external/lua.'
            exit 1
          fi

      - name: Compile and package the mod
        uses: geode-sdk/build-geode-mod@dce36b35e1c3d9d8af92347760b12eba3caf4004
        with:
          sdk: '6.0.0'
          cli: 'v4.0.2'
          target: ${{ matrix.target }}
          build-config: Release
          combine: 'true'

  package:
    name: Merge platform packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Combine .geode files
        id: combine
        uses: geode-sdk/build-geode-mod/combine@dce36b35e1c3d9d8af92347760b12eba3caf4004
        with:
          cli: 'v4.0.2'
          delete-artifacts: 'false'

      - name: Upload final .geode package
        uses: actions/upload-artifact@v7
        with:
          name: Geometron-Geode6
          path: ${{ steps.combine.outputs.build-output }}/*.geode
          if-no-files-found: error
